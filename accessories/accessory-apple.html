<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apple Audio | ASTER</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<h1>Apple Audio</h1>

<div class="products">

  <!-- ===== EARPHONES ===== -->

  <div class="card" data-name="airpods 2nd gen">
    <img src="../Images/appleearphones.png" alt="AirPods 2nd Gen">
    <h4>AirPods (2nd Gen)</h4>
    <p class="price">₹12,999</p>
    <button onclick="addToCart('AirPods 2nd Gen', '../Images/appleearphones.png',12999)">
      Add to Cart
    </button>
  </div>

  <div class="card" data-name="airpods 3rd gen">
    <img src="../Images/appleearphones.png" alt="AirPods 3rd Gen">
    <h4>AirPods (3rd Gen)</h4>
    <p class="price">₹18,999</p>
    <button onclick="addToCart('AirPods 3rd Gen', '../Images/appleearphones.png',18999)">
      Add to Cart
    </button>
  </div>

  <div class="card" data-name="airpods pro 2nd gen">
    <img src="../Images/appleearphones.png" alt="AirPods Pro">
    <h4>AirPods Pro (2nd Gen)</h4>
    <p class="price">₹24,999</p>
    <button onclick="addToCart('AirPods Pro 2nd Gen', '../Images/appleearphones.png',24999)">
      Add to Cart
    </button>
  </div>

  <div class="card" data-name="airpods usb c">
    <img src="../Images/appleearphones.png" alt="AirPods USB-C">
    <h4>AirPods USB-C</h4>
    <p class="price">₹19,999</p>
    <button onclick="addToCart('AirPods USB-C', '../Images/appleearphones.png',19999)">
      Add to Cart
    </button>
  </div>

  <!-- ===== HEADPHONES ===== -->

  <div class="card" data-name="airpods max">
    <img src="../Images/appleairpodsmax.png" alt="AirPods Max">
    <h4>AirPods Max</h4>
    <p class="price">₹59,999</p>
    <button onclick="addToCart('AirPods Max', '../Images/appleairpodsmax.png',59999)">
      Add to Cart
    </button>
  </div>

  <div class="card" data-name="airpods max usb c">
    <img src="../Images/appleairpodsmax.png" alt="AirPods Max USB-C">
    <h4>AirPods Max (USB-C)</h4>
    <p class="price">₹62,999</p>
    <button onclick="addToCart('AirPods Max USB-C', '../Images/appleairpodsmax.png',62999)">
      Add to Cart
    </button>
  </div>

  <div class="card" data-name="airpods max studio">
    <img src="../Images/appleairpodsmax.png" alt="AirPods Max Studio">
    <h4>AirPods Max Studio</h4>
    <p class="price">₹54,999</p>
    <button onclick="addToCart('AirPods Max Studio', '../Images/appleairpodsmax.png',54999)">
      Add to Cart
    </button>
  </div>

  <div class="card" data-name="airpods max wireless">
    <img src="../Images/appleairpodsmax.png" alt="AirPods Max Wireless">
    <h4>AirPods Max Wireless</h4>
    <p class="price">₹49,999</p>
    <button onclick="addToCart('AirPods Max Wireless', '../Images/appleairpodsmax.png',49999)">
      Add to Cart
    </button>
  </div>

</div>

<!-- IMPORTANT -->
<script src="../script.js"></script>

</body>
</html>
