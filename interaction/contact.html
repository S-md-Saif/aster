<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | ASTER</title>
  <link rel="stylesheet" href="../style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .contact-box {
      background: white;
      margin: 40px 200px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .contact-box h2 {
      margin-bottom: 20px;
    }

    .contact-box input,
    .contact-box textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .contact-box button {
      background: #0071e3;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .contact-box button:hover {
      transform: scale(1.1);
      background: #005bb5;
    }
  </style>
</head>

<body>

<!-- ===== NAVBAR ===== -->
<div class="navbar">
  <div class="logo">ASTER</div>
  <div class="menu">
    <a href="../index.html" class="menu-item">← Back to Home</a>
  </div>
</div>

<!-- ===== CONTACT ===== -->
<div class="contact-box">
  <h2>Contact Us</h2>

  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">
  <textarea rows="5" placeholder="Your Message"></textarea>

  <button onclick="submitMessage()">Send Message</button>
</div>

<script>
  function submitMessage() {
    alert("Message sent successfully 📩 (demo only)");
  }
</script>

</body>
</html>
