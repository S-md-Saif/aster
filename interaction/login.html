<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | ASTER</title>

  <!-- Main site CSS -->
  <link rel="stylesheet" href="../style.css">

  <!-- Mobile friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== LOGIN PAGE ONLY ===== */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: white;
      padding: 30px 35px;
      border-radius: 20px;
      width: 320px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .login-box button:hover {
      transform: scale(1.05);
      background: #005bb5;
    }

    .login-box p {
      font-size: 13px;
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="login-wrapper">
  <div class="login-box">
    <h2>Login to ASTER</h2>

    <input type="text" id="username" placeholder="Your Name">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="loginUser()">Login</button>

    <p>Don't have an account? Sign up is coming soon!</p>
  </div>
</div>

<script>
  function loginUser() {
    const name = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();

    if (!name || !email) {
      alert("Fill all fields bro 😅");
      return;
    }

    // save user
    localStorage.setItem("asterUser", name);

    // ✅ CORRECT redirect
    window.location.href = "../index.html";
  }
</script>

</body>
</html>
