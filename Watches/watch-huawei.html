<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Huawei Watches</title>

  <!-- Main CSS -->
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<h1>Huawei Watches</h1>

<div class="products">

  <!-- Huawei Watch GT 4 -->
  <div class="card">
    <img src="../Images/applewatch1.png" alt="Huawei Watch GT 4">
    <h4>Huawei Watch GT 4</h4>
    <p class="price">₹19,999</p>
    <button onclick="addToCart('Huawei Watch GT 4',19999,'../Images/applewatch1.png')">Add to Cart</button>
  </div>

  <!-- Huawei Watch GT 3 -->
  <div class="card">
    <img src="../Images/applewatch2.png" alt="Huawei Watch GT 3">
    <h4>Huawei Watch GT 3</h4>
    <p class="price">₹16,999</p>
    <button onclick="addToCart('Huawei Watch GT 3',16999,'../Images/applewatch2.png')">Add to Cart</button>
  </div>

  <!-- Huawei Watch Fit 2 -->
  <div class="card">
    <img src="../Images/fireboltwatch1.png" alt="Huawei Watch Fit 2">
    <h4>Huawei Watch Fit 2</h4>
    <p class="price">₹9,999</p>
    <button onclick="addToCart('Huawei Watch Fit 2',9999,'../Images/fireboltwatch1.png')">Add to Cart</button>
  </div>

  <!-- Huawei Watch Ultimate -->
  <div class="card">
    <img src="../Images/applewatch3.png" alt="Huawei Watch Ultimate">
    <h4>Huawei Watch Ultimate</h4>
    <p class="price">₹59,999</p>
    <button onclick="addToCart('Huawei Watch Ultimate',59999,'../Images/applewatch3.png')">Add to Cart</button>
  </div>

  <!-- Huawei Band 8 -->
  <div class="card">
    <img src="../Images/fireboltwatch2.png" alt="Huawei Band 8">
    <h4>Huawei Band 8</h4>
    <p class="price">₹4,999</p>
    <button onclick="addToCart('Huawei Band 8',4999,'../Images/fireboltwatch2.png')">Add to Cart</button>
  </div>

</div>
<script src="../script.js"></script>

</body>
</html>
