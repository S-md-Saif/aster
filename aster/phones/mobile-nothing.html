<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nothing Mobiles</title>

  <!-- main CSS -->
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<h1>Nothing Mobiles</h1>

<div class="products">

  <!-- Nothing Phone (1) -->
  <div class="card">
    <img src="../Images/nothingphone2.png" alt="Nothing Phone 1" loading="lazy">
    <h4>Nothing Phone (1)</h4>
    <p class="price">₹29,999</p>
    <button onclick="addToCart('Nothing Phone (1)',29999,'../Images/nothingphone2.png')">Add to Cart</button>
  </div>

  <!-- Nothing Phone (2) -->
  <div class="card">
    <img src="../Images/nothingphone2a.png" alt="Nothing Phone 2" loading="lazy">
    <h4>Nothing Phone (2)</h4>
    <p class="price">₹44,999</p>
    <button onclick="addToCart('Nothing Phone (2)',44999,'../Images/nothingphone2a.png')">Add to Cart</button>
  </div>

  <!-- Nothing Phone (3) -->
  <div class="card">
    <img src="../Images/nothingphone3.png" alt="Nothing Phone 3" loading="lazy">
    <h4>Nothing Phone (3)</h4>
    <p class="price">₹54,999</p>
    <button onclick="addToCart('Nothing Phone (3)',54999,'../Images/nothingphone3.png')">Add to Cart</button>
  </div>

  <!-- Nothing Phone (3a) -->
  <div class="card">
    <img src="../Images/nothingphone3a.png" alt="Nothing Phone 3a" loading="lazy">
    <h4>Nothing Phone (3a)</h4>
    <p class="price">₹34,999</p>
    <button onclick="addToCart('Nothing Phone (3a)',34999,'../Images/nothingphone3a.png')">Add to Cart</button>
  </div>

  <!-- Nothing Phone (3a Lite) -->
  <div class="card">
    <img src="../Images/nothingphone3alite.png" alt="Nothing Phone 3a Lite" loading="lazy">
    <h4>Nothing Phone (3a Lite)</h4>
    <p class="price">₹27,999</p>
    <button onclick="addToCart('Nothing Phone (3a Lite)',27999,'../Images/nothingphone3alite.png')">Add to Cart</button>
  </div>

</div>
<script src="../script.js"></script>

</body>
</html>
